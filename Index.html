<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letterbank v0.1</title>
<style>
  :root{
    --bg:#f3f0e8;
    --panel:#fffdf7;
    --ink:#25231f;
    --muted:#77736a;
    --line:#d8d2c5;
    --tile:#ffffff;
    --tile-used:#cfcac0;
    --shadow:0 8px 24px rgba(0,0,0,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:linear-gradient(180deg,#eee9df,#f7f5ef 35%);
    color:var(--ink);
  }
  header{
    padding:28px 24px 12px;
    max-width:1200px;
    margin:auto;
  }
  h1{
    margin:0;
    font-size:clamp(2rem,5vw,4.5rem);
    letter-spacing:-.055em;
    line-height:.92;
  }
  .tagline{
    margin-top:8px;
    color:var(--muted);
    font-size:1rem;
  }
  main{
    max-width:1200px;
    margin:auto;
    padding:16px 24px 40px;
    display:grid;
    grid-template-columns:minmax(0,1fr) 330px;
    gap:20px;
  }
  .stack{display:grid;gap:18px}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
  }
  .inputrow{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }
  input[type=text]{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:14px 16px;
    font:inherit;
    font-size:1.05rem;
    outline:none;
  }
  input[type=text]:focus{border-color:#9c9587}
  button{
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:12px;
    padding:12px 14px;
    font:inherit;
    font-weight:700;
    cursor:pointer;
  }
  button:hover{transform:translateY(-1px)}
  .primary{background:#25231f;color:white;border-color:#25231f}
  .tiny{padding:7px 10px;font-size:.85rem}
  .sectiontitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }
  .sectiontitle h2{
    font-size:1rem;
    margin:0;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .status{
    color:var(--muted);
    font-size:.85rem;
  }
  .workspace{
    min-height:130px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-content:flex-start;
    padding:10px 0 4px;
  }
  .blank{
    width:31px;
    height:42px;
    border-bottom:2px solid #aaa396;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:1.15rem;
  }
  .token{
    display:inline-flex;
    gap:1px;
    border-radius:12px;
    overflow:hidden;
    border:2px solid rgba(0,0,0,.08);
    cursor:pointer;
  }
  .token span{
    width:31px;
    height:42px;
    display:grid;
    place-items:center;
    font-weight:900;
    color:#151515;
    background:var(--token-color,#d9e8ff);
  }
  .joiner{
    display:inline-flex;
    align-items:center;
    padding:0 10px;
    height:42px;
    border-radius:10px;
    background:#ece8df;
    color:#5e594f;
    font-weight:800;
    cursor:pointer;
  }
  .lettergrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:8px;
  }
  .tile{
    aspect-ratio:1/1;
    background:var(--tile);
    border:1px solid var(--line);
    border-radius:10px;
    display:grid;
    place-items:center;
    font-size:1.15rem;
    font-weight:900;
    user-select:none;
    cursor:pointer;
    transition:.15s ease;
  }
  .tile.selected{
    outline:3px solid #25231f;
    transform:translateY(-2px);
  }
  .tile.used{
    background:var(--tile-used);
    color:#8a857b;
    cursor:not-allowed;
    text-decoration:line-through;
  }
  .compose{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:8px;
    margin-top:12px;
  }
  .selectedreadout{
    min-height:46px;
    border:1px dashed #bdb6a8;
    border-radius:12px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    font-weight:900;
    letter-spacing:.08em;
    background:#faf8f2;
  }
  .joins{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .sidebar{
    position:sticky;
    top:16px;
    height:fit-content;
  }
  .suggestions{
    display:grid;
    gap:8px;
    max-height:62vh;
    overflow:auto;
    padding-right:3px;
  }
  .suggestion{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
  }
  .suggestion small{color:var(--muted);font-weight:600}
  .empty{
    color:var(--muted);
    padding:10px 2px;
    line-height:1.45;
  }
  .legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .chip{
    border-radius:999px;
    padding:5px 9px;
    font-size:.8rem;
    font-weight:800;
    border:1px solid rgba(0,0,0,.08);
  }
  @media (max-width:820px){
    main{grid-template-columns:1fr}
    .sidebar{position:static}
    .suggestions{max-height:none}
  }
</style>
</head>
<body>
<header>
  <h1>Letterbank</h1>
  <div class="tagline">Reserve letters. Build chunks. See what’s left.</div>
</header>

<main>
  <div class="stack">
    <section class="card">
      <div class="sectiontitle">
        <h2>Source</h2>
        <div class="status" id="sourceCount"></div>
      </div>
      <div class="inputrow">
        <input id="sourceInput" type="text" value="Josh Montreuil" placeholder="Enter a word or phrase">
        <button class="primary" id="loadBtn">Load</button>
      </div>
    </section>

    <section class="card">
      <div class="sectiontitle">
        <h2>Arrangement</h2>
        <button class="tiny" id="clearTokensBtn">Clear tokens</button>
      </div>
      <div id="workspace" class="workspace"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <div class="sectiontitle">
        <h2>Letterbank</h2>
        <div class="status" id="balance"></div>
      </div>
      <div id="letterGrid" class="lettergrid"></div>

      <div class="compose">
        <div id="selectedReadout" class="selectedreadout">Select letters below</div>
        <button id="reserveBtn">Reserve</button>
        <button id="clearSelectionBtn">Clear</button>
      </div>
    </section>

    <section class="card">
      <div class="sectiontitle">
        <h2>Free joiners</h2>
        <div class="status">do not consume bank letters</div>
      </div>
      <div class="joins">
        <button class="tiny joinBtn" data-join="&">&amp;</button>
        <button class="tiny joinBtn" data-join="of">of</button>
        <button class="tiny joinBtn" data-join="the">the</button>
        <button class="tiny joinBtn" data-join="and">and</button>
        <button class="tiny joinBtn" data-join="de">de</button>
        <button class="tiny joinBtn" data-join="von">von</button>
        <button class="tiny joinBtn" data-join="Dr.">Dr.</button>
        <button class="tiny joinBtn" data-join="Mrs.">Mrs.</button>
        <button class="tiny joinBtn" data-join="Jr.">Jr.</button>
      </div>
    </section>
  </div>

  <aside class="card sidebar">
    <div class="sectiontitle">
      <h2>Possible words</h2>
      <div class="status" id="suggestCount"></div>
    </div>
    <div id="suggestions" class="suggestions"></div>
  </aside>
</main>

<script>
const COLORS = [
  "#b8d8ff","#ffe49b","#c7f2c2","#f7bdd5","#d8c8ff",
  "#bce9e5","#ffc8a8","#e7ef9f","#d9d9d9","#ffd2ef"
];

const WORDS = `
homer tom juliet joliet jolie julie julia julio jules juno junior
monster mortino ostrom holstrom thorson munro storm north mount hunt
morton horton moore simon ruth joel louis justin emil mason orson
mansour house autumn tuna tounis morino holmes thomas john josh
more most tone torn sort sour tour ours rust suit unit ruin trio trim
moon room root loom soon motor honor humor hour home hero host shot
this thin hint into lion loin line mile mine mint minor norm north
south stone storm stout thorn thorny mount mouth month mourn
shore short shout shirt shoot sumo omit item time tire tier rite
role lore lone tone note tune unto route outer urine union
jolt joint join joust jute june ruin rune true rule soul soil
hotel motel torso metro timer title little
`.trim().split(/\s+/);

let letters = [];
let selectedIds = [];
let tokens = [];
let tokenCounter = 0;

const normalize = s => s.toUpperCase().replace(/[^A-Z]/g, "");

function loadSource(){
  const raw = document.getElementById("sourceInput").value;
  const clean = normalize(raw);
  letters = [...clean].map((ch,i)=>({id:i,ch,usedBy:null}));
  selectedIds = [];
  tokens = [];
  tokenCounter = 0;
  renderAll();
}

function countsFromChars(chars){
  const c = {};
  for(const ch of chars) c[ch] = (c[ch]||0)+1;
  return c;
}
function availableCounts(){
  return countsFromChars(letters.filter(l=>!l.usedBy).map(l=>l.ch));
}
function canBuild(word, counts=availableCounts()){
  const need = countsFromChars(normalize(word));
  return Object.entries(need).every(([ch,n]) => (counts[ch]||0) >= n);
}
function getIdsForWord(word){
  const needed = [...normalize(word)];
  const picked = [];
  const tempUsed = new Set();
  for(const ch of needed){
    const match = letters.find(l=>!l.usedBy && !tempUsed.has(l.id) && l.ch===ch);
    if(!match) return null;
    picked.push(match.id);
    tempUsed.add(match.id);
  }
  return picked;
}

function reserveSelected(){
  if(!selectedIds.length) return;
  const text = selectedIds.map(id=>letters.find(l=>l.id===id).ch).join("");
  createToken(text, selectedIds);
  selectedIds = [];
  renderAll();
}

function createToken(text, ids){
  const id = "t"+(++tokenCounter);
  const color = COLORS[(tokenCounter-1)%COLORS.length];
  tokens.push({id,text,color,ids:[...ids],joiner:false});
  ids.forEach(letterId => {
    const l = letters.find(x=>x.id===letterId);
    if(l) l.usedBy = id;
  });
}

function reserveWord(word){
  const ids = getIdsForWord(word);
  if(!ids) return;
  createToken(word.toUpperCase(), ids);
  selectedIds = [];
  renderAll();
}

function addJoiner(text){
  tokens.push({
    id:"j"+(++tokenCounter),
    text,
    color:"#ece8df",
    ids:[],
    joiner:true
  });
  renderAll();
}

function removeToken(id){
  const token = tokens.find(t=>t.id===id);
  if(!token) return;
  token.ids.forEach(letterId=>{
    const l = letters.find(x=>x.id===letterId);
    if(l) l.usedBy = null;
  });
  tokens = tokens.filter(t=>t.id!==id);
  renderAll();
}

function clearTokens(){
  letters.forEach(l=>l.usedBy=null);
  tokens=[];
  selectedIds=[];
  renderAll();
}

function renderWorkspace(){
  const el = document.getElementById("workspace");
  el.innerHTML="";
  tokens.forEach(t=>{
    const node = document.createElement("div");
    if(t.joiner){
      node.className="joiner";
      node.textContent=t.text;
    } else {
      node.className="token";
      node.style.setProperty("--token-color",t.color);
      [...t.text].forEach(ch=>{
        const s=document.createElement("span");
        s.textContent=ch;
        node.appendChild(s);
      });
    }
    node.title="Click to release";
    node.onclick=()=>removeToken(t.id);
    el.appendChild(node);
  });

  const remaining = letters.filter(l=>!l.usedBy).length;
  for(let i=0;i<remaining;i++){
    const b=document.createElement("div");
    b.className="blank";
    el.appendChild(b);
  }
}

function renderLetters(){
  const grid=document.getElementById("letterGrid");
  grid.innerHTML="";
  letters.forEach(l=>{
    const d=document.createElement("div");
    d.className="tile";
    d.textContent=l.ch;
    if(l.usedBy) d.classList.add("used");
    if(selectedIds.includes(l.id)) d.classList.add("selected");
    d.onclick=()=>{
      if(l.usedBy) return;
      if(selectedIds.includes(l.id)){
        selectedIds=selectedIds.filter(x=>x!==l.id);
      } else {
        selectedIds.push(l.id);
      }
      renderLetters();
      renderSelected();
    };
    grid.appendChild(d);
  });
}

function renderSelected(){
  const txt=selectedIds.map(id=>letters.find(l=>l.id===id).ch).join("");
  document.getElementById("selectedReadout").textContent = txt || "Select letters below";
}

function renderLegend(){
  const legend=document.getElementById("legend");
  legend.innerHTML="";
  tokens.filter(t=>!t.joiner).forEach(t=>{
    const chip=document.createElement("div");
    chip.className="chip";
    chip.style.background=t.color;
    chip.textContent=t.text;
    legend.appendChild(chip);
  });
}

function renderSuggestions(){
  const box=document.getElementById("suggestions");
  box.innerHTML="";
  const counts=availableCounts();
  const availCount=letters.filter(l=>!l.usedBy).length;
  let matches=[...new Set(WORDS)]
    .filter(w=>normalize(w).length>=2 && normalize(w).length<=availCount && canBuild(w,counts))
    .sort((a,b)=> b.length-a.length || a.localeCompare(b));

  document.getElementById("suggestCount").textContent = matches.length+" found";
  if(!matches.length){
    box.innerHTML='<div class="empty">No built-in suggestions fit the remaining letters. You can still reserve tiles manually.</div>';
    return;
  }

  matches.slice(0,120).forEach(w=>{
    const btn=document.createElement("button");
    btn.className="suggestion";
    btn.innerHTML=`<span>${w}</span><small>${w.length}</small>`;
    btn.onclick=()=>reserveWord(w);
    box.appendChild(btn);
  });
}

function renderStats(){
  const total=letters.length;
  const remaining=letters.filter(l=>!l.usedBy).length;
  document.getElementById("sourceCount").textContent = total+" letters";
  document.getElementById("balance").textContent = remaining+" remaining";
}

function renderAll(){
  renderWorkspace();
  renderLetters();
  renderSelected();
  renderLegend();
  renderSuggestions();
  renderStats();
}

document.getElementById("loadBtn").onclick=loadSource;
document.getElementById("reserveBtn").onclick=reserveSelected;
document.getElementById("clearSelectionBtn").onclick=()=>{selectedIds=[];renderLetters();renderSelected();};
document.getElementById("clearTokensBtn").onclick=clearTokens;
document.querySelectorAll(".joinBtn").forEach(b=>b.onclick=()=>addJoiner(b.dataset.join));
document.getElementById("sourceInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") loadSource();
});

loadSource();
</script>
</body>
</html>
